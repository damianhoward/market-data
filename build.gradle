// Real instrument reference and quotes for the trading estate: fetches a symbol's mark from an
// external provider and serves the last-good snapshot, so a consumer (the live order book) can
// anchor its book to a real price instead of a synthetic seed. A library, published to Maven
// Central — no service, no box of its own.
plugins {
    id 'com.damianhoward.kotlin-conventions' version '0.6.0'
    id 'application'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'com.damianhoward'
version = '2.0.2'

application {
    applicationName = 'market-data'
    mainClass = 'com.damianhoward.marketdata.MainKt'
}

// Published to Maven Central by the release workflow when a version is tagged, so a consumer
// resolves com.damianhoward:market-data like any other library. Central requires sources, a
// javadoc jar and a complete POM, and refuses the upload without them.
mavenPublishing {
    configure(new com.vanniktech.maven.publish.KotlinJvm(new com.vanniktech.maven.publish.JavadocJar.Empty(), true))
    coordinates('com.damianhoward', 'market-data', version.toString())
    publishToMavenCentral(true)
    // Signed where the release workflow supplies a key; it arrives empty everywhere else.
    if (!providers.gradleProperty('signingInMemoryKey').getOrElse('').isBlank()) {
        signAllPublications()
    }
    pom {
        name = 'market-data'
        description = 'Real instrument reference and last-good quotes for the damianhoward trading estate.'
        url = 'https://github.com/damianhoward/market-data'
        inceptionYear = '2026'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'damianhoward'
                name = 'Damian Howard'
                url = 'https://github.com/damianhoward'
            }
        }
        scm {
            url = 'https://github.com/damianhoward/market-data'
            connection = 'scm:git:https://github.com/damianhoward/market-data.git'
            developerConnection = 'scm:git:ssh://git@github.com/damianhoward/market-data.git'
        }
    }
}

dependencies {
    implementation deps.gson
    implementation deps.slf4j.api
    runtimeOnly deps.slf4j.simple
}

// Only the process entry point (MainKt — main() fetches a live quote and prints it) is excluded.
// The provider client, JSON parsing, cache, and domain are all exercised by tests and counted.
coverageExcludes = ['**/marketdata/MainKt.class']